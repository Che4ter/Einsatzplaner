name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            build-essential

      - name: Run Go tests
        run: go test ./einsatzplan/...

      - name: Run Go vet
        run: go vet ./einsatzplan/...

      - name: Run frontend unit tests
        run: node --test 'frontend/_tests/*.test.js'

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            build-essential

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.95

      - name: Generate JS bindings
        run: wails3 generate bindings -b -d frontend/bindings

      - name: Build
        env:
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
          FIRESTORE_API_KEY: ${{ secrets.FIRESTORE_API_KEY }}
        run: |
          go build -tags production \
            -ldflags="-w -s \
              -X main.Version=${{ github.ref_name }} \
              -X main.FirestoreProjectID=${FIRESTORE_PROJECT_ID} \
              -X main.FirestoreAPIKey=${FIRESTORE_API_KEY}" \
            -o bin/einsatzplaner .

      - name: Verify tests are not embedded in the binary
        run: |
          if grep -qa "node:test" bin/einsatzplaner; then
            echo "::error::Frontend test files were embedded in the binary"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: einsatzplaner-linux
          path: bin/einsatzplaner

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.95

      - name: Generate JS bindings
        run: wails3 generate bindings -b -d frontend/bindings

      - name: Build
        env:
          CGO_ENABLED: "1"
          CC: gcc
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
          FIRESTORE_API_KEY: ${{ secrets.FIRESTORE_API_KEY }}
        run: |
          go build -tags production `
            -ldflags="-w -s `
              -X main.Version=${{ github.ref_name }} `
              -X main.FirestoreProjectID=$env:FIRESTORE_PROJECT_ID `
              -X main.FirestoreAPIKey=$env:FIRESTORE_API_KEY" `
            -o bin/einsatzplaner.exe .

      - uses: actions/upload-artifact@v7
        with:
          name: einsatzplaner-windows
          path: bin/einsatzplaner.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: einsatzplaner-linux
          path: dist/linux

      - uses: actions/download-artifact@v7
        with:
          name: einsatzplaner-windows
          path: dist/windows

      - name: Make Linux binary executable
        run: chmod +x dist/linux/einsatzplaner

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/linux/einsatzplaner
            dist/windows/einsatzplaner.exe
