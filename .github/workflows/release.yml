name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            build-essential

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.95

      - name: Generate JS bindings
        run: wails3 generate bindings -b -d frontend/bindings

      - name: Build
        run: go build -tags production -ldflags="-w -s -X main.Version=${{ github.ref_name }}" -o bin/einsatzplaner .

      - uses: actions/upload-artifact@v4
        with:
          name: einsatzplaner-linux
          path: bin/einsatzplaner

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.95

      - name: Generate JS bindings
        run: wails3 generate bindings -b -d frontend/bindings

      - name: Build
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go build -tags production -ldflags="-w -s -X main.Version=${{ github.ref_name }}" -o bin/einsatzplaner.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: einsatzplaner-windows
          path: bin/einsatzplaner.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: einsatzplaner-linux
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: einsatzplaner-windows
          path: dist/windows

      - name: Make Linux binary executable
        run: chmod +x dist/linux/einsatzplaner

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/linux/einsatzplaner
            dist/windows/einsatzplaner.exe
